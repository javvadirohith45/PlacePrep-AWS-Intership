{% extends 'base.html' %}{% block content %}<div class="container"><div class="page-head"><span class="eyebrow">Admin · Question bank</span><h1>Questions</h1></div><div class="dashboard-grid"><form class="card" method="post" action="{{url_for('admin.new_question')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><h2>Create question</h2><label>Question</label><textarea name="question" required></textarea><label>Explanation</label><textarea name="explanation"></textarea><label>Correct answer</label><select class="select" name="correct_answer"><option>A</option><option>B</option><option>C</option><option>D</option></select><label>Category ID</label><input class="input" name="category_id"><label>Topic ID</label><input class="input" name="topic_id"><label>Difficulty</label><select class="select" name="difficulty"><option>Easy</option><option>Medium</option><option>Hard</option></select><button class="btn btn-primary" style="margin-top:14px">Create</button></form><div class="card"><h2>Existing</h2>{% for q in questions %}<div style="padding:12px 0;border-bottom:1px solid var(--border)"><strong>{{q.question}}</strong><small class="muted" style="display:block">{{q.topic.name if q.topic else 'Unassigned'}} · {{q.difficulty}}</small></div>{% endfor %}</div></div></div>{% endblock %}
