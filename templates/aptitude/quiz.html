{% extends 'base.html' %}{% block content %}<div class="container"><div class="page-head"><span class="eyebrow">Practice session</span><h1>{{topic.name}}</h1><p class="muted">Select an answer, submit it and get immediate feedback.</p></div>{% for q in questions %}<div class="card" data-question="{{q.id}}" style="margin-bottom:16px"><h3>{{loop.index}}. {{q.question}}</h3>{% for o in q.options %}<div class="option" data-answer="{{o.label}}"><b>{{o.label}}</b><span>{{o.text}}</span></div>{% endfor %}<div style="display:flex;gap:10px;margin-top:14px"><button class="btn btn-primary submit-answer">Check answer</button><button class="icon-btn" data-bookmark="{{q.id}}">☆</button></div><div class="feedback" style="display:none;margin-top:14px"></div></div>{% endfor %}</div><script>document.querySelectorAll('[data-question]').forEach(card=>{let selected=null;card.querySelectorAll('.option').forEach(o=>o.onclick=()=>{card.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));o.classList.add('selected');selected=o.dataset.answer});card.querySelector('.submit-answer').onclick=async()=>{if(!selected)return;const r=await fetch('/practice/api/answer',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':document.querySelector('meta[name=csrf-token]').content},body:JSON.stringify({question_id:card.dataset.question,answer:selected})});const d=await r.json();const f=card.querySelector('.feedback');f.style.display='block';f.innerHTML=(d.correct?'✅ Correct. ':'❌ Not quite. Correct answer: '+d.correct_answer+'. ')+d.explanation;}})</script>{% endblock %}
