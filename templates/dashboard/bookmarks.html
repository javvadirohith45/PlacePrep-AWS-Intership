{% extends 'base.html' %}{% block content %}<div class="container"><div class="page-head"><span class="eyebrow">Saved questions</span><h1>Bookmarks</h1></div><div class="grid-3">{% for b in bookmarks %}<div class="card"><span class="tag">{{b.question.difficulty}}</span><h3>{{b.question.question}}</h3><p class="muted">{{b.question.explanation}}</p><button class="btn btn-ghost" data-bookmark="{{b.question_id}}">Remove bookmark</button></div>{% else %}<div class="card"><h3>No bookmarks yet.</h3><p class="muted">Save questions while practicing.</p><a class="btn btn-primary" href="{{url_for('practice.index')}}">Practice now</a></div>{% endfor %}</div></div>{% endblock %}
